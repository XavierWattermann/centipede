            <!-- VERTEX SHADER -->
            <script type="x-shader/x-vertex" id="vertex-shader-square">
                attribute vec4 myPosition;
                uniform float theta;
                uniform vec2 move;
                void main() {
                    float xi, yi, xf, yf;
                    xi = myPosition.x;
                    yi = myPosition.y;
                    xf = xi * cos(theta) + yi * sin(theta) + move.x;
                    yf = -xi * sin(theta) + yi * cos(theta) + move.y;
                    gl_Position.x = xf;
                    gl_Position.y = yf;
                    gl_Position.z = 0.0;
                    gl_Position.w = 1.0;
                    gl_PointSize = 1.0;
                }
            </script>
            <!-- FRAGMENT SHADER -->
            <script type="x-shader/x-fragment" id="fragment-shader-square">
                precision mediump float;
                uniform vec4 uColor;
                void main() {
                    gl_FragColor = uColor;
                }
            </script>
    </head>
